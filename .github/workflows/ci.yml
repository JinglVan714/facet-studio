name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests (no API keys required)
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: python -m pytest tests -q
      - name: P4 fixture gate (synthetic, no local runs)
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: |
          python -m facet_studio.evals.product \
            --cases evals/product_v1/cases.fixture.json \
            --runs-root evals/product_v1/fixtures/runs_root \
            --out /tmp/facet_fixture_report --gate
