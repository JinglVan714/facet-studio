<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三花与玳瑁的毛色对比">
<title>三花与玳瑁的毛色对比</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<text x="24" y="52" font-size="14" font-weight="700" fill="#0f172a">三花</text>
<text x="24" y="72" font-size="12" fill="#475569">黑、黄、白三块颜色边界清晰拼接</text>
<line x1="170" y1="64" x2="660" y2="64" stroke="#cbd5e1" stroke-width="2"/>
<line x1="292.5" y1="58" x2="292.5" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="415.0" y1="58" x2="415.0" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="537.5" y1="58" x2="537.5" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
<text x="24" y="124" font-size="14" font-weight="700" fill="#0f172a">玳瑁</text>
<text x="24" y="144" font-size="12" fill="#475569">三色混杂无明显分界，白色很少</text>
<line x1="170" y1="136" x2="660" y2="136" stroke="#cbd5e1" stroke-width="2"/>
<line x1="292.5" y1="130" x2="292.5" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="415.0" y1="130" x2="415.0" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="537.5" y1="130" x2="537.5" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
<text x="360" y="202" text-anchor="middle" font-size="12" fill="#94a3b8">示意：三花与玳瑁的毛色分布对比示意。</text>
</g>
</svg>
